services:
  # Backend API Web Service
  - type: web
    name: divyam-ayurveda-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: CLIENT_ORIGIN
        value: https://divyam-ayurveda-dgha.onrender.com

  # Frontend Static Site
  - type: web
    name: divyam-ayurveda-frontend
    env: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://divyam-ayurveda.onrender.com

