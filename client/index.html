<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173D2A" />

    <!-- Primary SEO -->
    <title>Divyam Ayurveda | Ayurvedic Herbal Products &amp; Wellness</title>
    <meta
      name="description"
      content="Shop authentic Ayurvedic herbal products from Divyam Ayurveda: Shilajit, Ashwagandha, herbal wellness supplements and natural skincare, delivered across India."
    />
    <link rel="canonical" href="https://divyamayurveda.in/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="48x48" href="/images/Fevicon/icon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/images/Fevicon/icon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/Fevicon/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/Fevicon/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Divyam Ayurveda" />
    <meta property="og:title" content="Divyam Ayurveda | Ayurvedic Herbal Products &amp; Wellness" />
    <meta
      property="og:description"
      content="Shop authentic Ayurvedic herbal products from Divyam Ayurveda: Shilajit, Ashwagandha, herbal wellness supplements and natural skincare, delivered across India."
    />
    <meta property="og:url" content="https://divyamayurveda.in/" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://divyamayurveda.in/images/Logo/Logo1.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1633" />
    <meta property="og:image:height" content="912" />
    <meta property="og:image:alt" content="Divyam Ayurveda logo" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Divyam Ayurveda | Ayurvedic Herbal Products &amp; Wellness" />
    <meta
      name="twitter:description"
      content="Shop authentic Ayurvedic herbal products from Divyam Ayurveda: Shilajit, Ashwagandha, herbal wellness supplements and natural skincare, delivered across India."
    />
    <meta name="twitter:image" content="https://divyamayurveda.in/images/Logo/Logo1.png" />
    <meta name="twitter:image:alt" content="Divyam Ayurveda logo" />

    <!-- Fonts: preconnect, then load the stylesheet without blocking first render (display=swap keeps text visible) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
      />
    </noscript>

    <!-- Structured data: Organization + WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://divyamayurveda.in/#organization",
            "name": "Divyam Ayurveda",
            "url": "https://divyamayurveda.in/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://divyamayurveda.in/images/Logo/Logo.png",
              "width": 669,
              "height": 373
            },
            "description": "Divyam Ayurveda is an Ayurvedic herbal products and wellness brand offering Shilajit, Ashwagandha, herbal supplements and natural skincare in India.",
            "sameAs": ["https://www.instagram.com/divyamayurveda678/"]
          },
          {
            "@type": "WebSite",
            "@id": "https://divyamayurveda.in/#website",
            "name": "Divyam Ayurveda",
            "url": "https://divyamayurveda.in/",
            "inLanguage": "en-IN",
            "publisher": { "@id": "https://divyamayurveda.in/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>Divyam Ayurveda needs JavaScript enabled to browse and shop our Ayurvedic herbal products.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
