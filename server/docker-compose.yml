services:
  mongo:
    image: mongo:7.0
    container_name: divyam_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: divyam_ayurveda
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: divyam_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/divyam_ayurveda
      CLIENT_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: replace_with_64_plus_random_bytes_super_secret_divyam_access_token_key_2026
      JWT_REFRESH_SECRET: replace_with_different_64_plus_random_bytes_super_secret_divyam_refresh_key_2026
      COOKIE_SECURE: "false"
      OBJECT_STORAGE_PROVIDER: local
    depends_on:
      - mongo

volumes:
  mongo_data:

